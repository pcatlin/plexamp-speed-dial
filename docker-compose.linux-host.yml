# Optional Linux override: API uses host networking so Pioneer eISCP (and Sonos)
# talk to LAN devices without Docker bridge NAT. Not for Docker Desktop / Mac.
#
#   docker compose -f docker-compose.yml -f docker-compose.linux-host.yml up -d --build
#
# Requires the eISCP serialize/cache fix in the API image (pull/rebuild after that lands).
services:
  db:
    ports:
      - "5432:5432"

  api:
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://plexamp:plexamp_local_only@127.0.0.1:5432/plexamp_speed_dial

  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/nginx.linux-host.conf:/etc/nginx/conf.d/default.conf:ro
